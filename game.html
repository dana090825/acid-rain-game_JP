<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <title>산성비 - Game</title>

    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/game.css">
    <link rel="stylesheet" href="./css/modal.css">
</head>

<body>
    <div class="game-container">
        <header class="game-header">
            <div class="stat kr-text"><span data-i18n="timeLeft">남은 시간</span>: <span id="time-remaining">0</span><span data-i18n="sec">초</span></div>
            <div class="stat kr-text"><span data-i18n="scoreLabel">점수</span>: <span id="current-score">0</span></div>
            <div class="stat kr-text"><span data-i18n="bestLabel">최고 점수</span>: <span id="best-score">0</span></div>
            <button id="exit-btn" class="exit-btn kr-text" data-i18n="exit">나가기</button>
        </header>

        <main class="game-main">
            <div class="falling-area" id="falling-area"></div>

            <div class="input-area">
                <input id="answer-input" type="text" data-i18n-ph="answerPh" placeholder="뜻을 한글로 입력 후 Enter 또는 버튼"
                    autocomplete="off" class="kr-text" />
                <button id="submit-answer" class="intro-start_btn kr-text" data-i18n="submit">
                    입력
                </button>
            </div>
        </main>
    </div>
    <div class="life-container kr-text">
        <span id="life-hearts">♥♥♥♥♥</span>
    </div>


    <div id="game-modal-overlay" class="game-modal-overlay hidden">
        <!-- 점수 모달 -->
        <div id="result-modal" class="game-modal">
            <div class="game-modal-title kr-text" data-i18n="gameOver">게임 종료</div>

            <div class="game-modal-score kr-text">
                <span data-i18n="scoreLabel">점수</span>: <span id="modal-score">0</span>
            </div>
            <div class="game-modal-best kr-text">
                <span data-i18n="bestLabel">최고 점수</span>: <span id="modal-best-score">0</span>
            </div>

            <button id="open-wrong-btn" class="modal-link kr-text" data-i18n="reviewWrong">
                오답 모아보기
            </button>

            <div class="game-modal-buttons">
                <button id="restart-btn" class="modal-btn kr-text" data-i18n="restart">다시 시작하기</button>
                <button id="quit-btn" class="modal-btn modal-btn-secondary kr-text" data-i18n="quit">
                    그만하기
                </button>
            </div>
        </div>

        <!-- 오답 전용 모달 -->
        <div id="wrong-modal" class="game-modal wrong-only hidden">
            <div class="game-modal-title kr-text" data-i18n="wrongTitle">오답 모아보기</div>

            <table class="wrong-table kr-text">
                <thead>
                    <tr>
                        <th data-i18n="thJp">일본어</th>
                        <th data-i18n="thAnswer">정답</th>
                        <th data-i18n="thUser">내 입력</th>
                    </tr>
                </thead>
                <tbody id="wrong-table-body"></tbody>
            </table>

            <div class="game-modal-buttons">
                <button id="wrong-back-btn" class="modal-btn kr-text" data-i18n="back">
                    돌아가기
                </button>
            </div>
        </div>
    </div>

    <script src="./js/i18n.js"></script>
    <script src="./js/game.js"></script>
</body>

</html>
